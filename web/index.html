<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="flutter_ui_kit">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/ico" href="icons/favicon.ico"/>
  <title>EduLift - Education Admin Portal</title>

  <link rel="manifest" href="manifest.json">

  <script>
    const serviceWorkerVersion = null;
  </script>
  <script src="flutter.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>
  <script type="text/javascript">
    window.flutterWebRenderer = "html";
  </script>
  <style>
    /* Fullscreen loader styles */
    #splash-screen {
      position: fixed;
     top: 0; left: 0; right: 0; bottom: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff; /* Set background color */
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    #splash-screen img {
      width: 192px;
      height: 192px;
      margin-bottom: 20px;
    }
    /* Loader animation */
    #loader {
      border: 5px solid #f3f3f3; /* Light grey */
      border-top: 5px solid #3498db; /* Blue */
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin-top: 20px;
    }

    /* Spin animation */
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
<!-- Splash screen loader -->
<div id="splash-screen">
  <!-- Replace this div with an image if needed -->
  <img src="icons/Icon-512.png" alt="App Logo">
  <!--  <div id="loader"></div>-->
</div>

<script>
  window.addEventListener('load', function() {
    // Initialize the Flutter web app
    _flutter.loader.loadEntrypoint({
      serviceWorker: {
        serviceWorkerVersion: serviceWorkerVersion,
      },
      onEntrypointLoaded: function(engineInitializer) {
        // Run the app and hide the splash screen when the app is ready
        engineInitializer.initializeEngine().then(function(appRunner) {
          appRunner.runApp();
          // Hide splash screen after app is ready
          const splashScreen = document.getElementById('splash-screen');
          splashScreen.style.display = 'none';
        });
      }
    });
  });
</script>
</body>
</html>
